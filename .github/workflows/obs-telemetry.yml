name: OBS Telemetry

on:
  pull_request:
    paths:
      - "obs-telemetry-mod/**"
      - ".github/workflows/obs-telemetry.yml"
  push:
    branches: [main]
    paths:
      - "obs-telemetry-mod/**"
      - ".github/workflows/obs-telemetry.yml"
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          [
            "1.21",
            "1.21.1",
            "1.21.2",
            "1.21.3",
            "1.21.4",
            "1.21.5",
            "1.21.6",
            "1.21.7",
            "1.21.8",
            "1.21.9",
            "1.21.10",
            "1.21.11",
            "26.1",
            "26.1.1",
            "26.1.2",
            "26.2",
            "26.3",
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Build the version-specific client mod
        working-directory: obs-telemetry-mod
        run: bash ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} --console=plain
