<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256" fill="none">
  <title>PaintShot launcher</title>
  <desc>A grass block with a diagonal pixel paintbrush and turquoise, green and violet paint.</desc>
