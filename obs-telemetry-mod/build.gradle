buildscript {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies { classpath "net.fabricmc:fabric-loom:${loom_version}" }
}

def modernMinecraft = project.minecraft_version.tokenize('.')[0].toInteger() >= 26
apply plugin: modernMinecraft ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
def javaRelease = modernMinecraft ? 25 : 21
def identifierAccessor = modernMinecraft || project.minecraft_version == '1.21.11'

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = "obs-telemetry"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"obs-telemetry" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (modernMinecraft) {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	} else {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	}
}

// Keep the transport and payload implementation shared; only ResourceKey's
// renamed accessor differs between the mapped and unobfuscated game APIs.
def generatedClient = layout.buildDirectory.dir('generated/sources/telemetry/client')
tasks.register('generateTelemetryClient', Copy) {
	inputs.property('identifierAccessor', identifierAccessor)
	from('src/client/java')
	into(generatedClient)
	filter { line -> identifierAccessor ? line.replace('.dimension().location()', '.dimension().identifier()') : line }
}
sourceSets.client.java.setSrcDirs([generatedClient])
tasks.named('compileClientJava') { dependsOn 'generateTelemetryClient' }

processResources {
	def version = project.version
	def minecraftVersion = project.minecraft_version
	def loaderVersion = project.loader_version
	inputs.property "version", version
	inputs.property "minecraft_version", minecraftVersion
	inputs.property "loader_version", loaderVersion
	inputs.property "java_version", javaRelease

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": minecraftVersion, "loader_version": loaderVersion, "java_version": javaRelease
	}
}

def telemetryJar = tasks.named(modernMinecraft ? 'jar' : 'remapJar')
telemetryJar.configure {
	archiveFileName = "obs-telemetry-${project.mod_version}+mc${project.minecraft_version}.jar"
}

tasks.register("copyTelemetryJar", Copy) {
	dependsOn telemetryJar
	from(telemetryJar.flatMap { it.archiveFile })
	into(layout.projectDirectory.dir("../src-tauri/resources/obs-telemetry"))
}

tasks.named("build") {
	finalizedBy tasks.named("copyTelemetryJar")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
