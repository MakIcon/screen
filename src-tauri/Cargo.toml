[package]
name = "screen"
version = "0.2.1"
description = "ScreenLauncher desktop application"
authors = ["makar"]
edition = "2021"

[lib]
name = "screen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2"
# Pinned: updater >= 2.13 and process >= 2.4 require tauri 2.12. Keep these minors
# in step with the npm @tauri-apps/plugin-updater / plugin-process packages.
tauri-plugin-updater = "~2.12"
tauri-plugin-process = "~2.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
semver = "1"
discord-rich-presence = "1.1"

reqwest = { version = "0.13.2", default-features = false, features = ["json", "multipart", "native-tls", "socks"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt-multi-thread", "time", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
md5 = "0.8.0"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = "0.38.4"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
