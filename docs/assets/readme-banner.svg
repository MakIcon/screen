<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="328" viewBox="0 0 1200 328" role="img" aria-labelledby="title desc">
  <title id="title">ScreenLauncher</title>
  <desc id="desc">Minimal ScreenLauncher banner: Minecraft, the way you want it.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#191b1a"/>
      <stop offset="1" stop-color="#111210"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f06b29"/>
      <stop offset="1" stop-color="#c94709"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop stop-color="#c94709" stop-opacity=".20"/>
      <stop offset="1" stop-color="#c94709" stop-opacity="0"/>
    </radialGradient>
    <filter id="iconShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="17" stdDeviation="19" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="328" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="328" fill="url(#surface)"/>
    <circle cx="971" cy="165" r="325" fill="url(#ambient)"/>
    <path d="M0 327H1200" stroke="#343633" stroke-width="2"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <circle cx="79" cy="67" r="5" fill="#e66b31"/>
      <text x="95" y="72" fill="#d3aa92" font-size="15" font-weight="700" letter-spacing="2.6">A MINECRAFT LAUNCHER</text>
      <text x="70" y="154" fill="#f4f1ea" font-size="71" font-weight="750" letter-spacing="-3.5">ScreenLauncher</text>
      <text x="74" y="217" fill="#f0ede6" font-size="31" font-weight="600" letter-spacing="-.75">Minecraft, the way you want it.</text>
      <text x="76" y="263" fill="#a6a9a2" font-size="21">Your builds. Your mods. One place.</text>
    </g>
    <rect x="889" y="53" width="224" height="224" rx="37" fill="url(#tile)" filter="url(#iconShadow)"/>
    <g transform="translate(889 53) scale(7)">
      <path d="M7 7H22V11H11V14H25V25H7V21H21V18H7Z" fill="#f4f1ea"/>
      <rect x="22" y="7" width="3" height="4" fill="#252524"/>
    </g>
  </g>
</svg>
