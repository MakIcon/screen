<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">ScreenLauncher</title>
  <desc id="desc">A custom illustrated ScreenLauncher banner in charcoal, ivory and terracotta, inspired by the app icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20221E"/><stop offset="1" stop-color="#10110F"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FE7432"/><stop offset="1" stop-color="#C94709"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop stop-color="#C94709" stop-opacity=".24"/><stop offset="1" stop-color="#C94709" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FCF7EC" stroke-opacity=".07" stroke-width="1"/></pattern>
    <clipPath id="rounded"><rect width="1200" height="390" rx="25"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".30"/></filter>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="390" fill="url(#bg)"/>
    <rect width="1200" height="390" fill="url(#grid)"/>
    <circle cx="1000" cy="190" r="320" fill="url(#glow)"/>
    <path d="M0 0H14V390H0Z" fill="url(#accent)"/>
    <path d="M756 -20L1200 0V390H956Z" fill="#C94709" opacity=".08"/>
    <path d="M750 0L1020 390M823 0L1090 390M897 0L1163 390" stroke="#FCE5D7" stroke-opacity=".065" stroke-width="2"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="72" y="54" width="9" height="9" fill="#F0783C"/>
      <text x="96" y="63" fill="#EFAF85" font-size="13" font-weight="700" letter-spacing="4">YOUR NEXT WORLD STARTS HERE</text>
      <text x="69" y="166" fill="#F4F1EA" font-size="75" font-weight="850" letter-spacing="-4">SCREEN</text>
      <text x="68" y="238" fill="#F4F1EA" font-size="75" font-weight="850" letter-spacing="-4">LAUNCHER<tspan fill="#E56122">.</tspan></text>
      <rect x="72" y="268" width="62" height="4" rx="2" fill="url(#accent)"/>
      <text x="72" y="309" fill="#BDBBB2" font-size="19" letter-spacing=".25">Your Minecraft. Your builds. Your rules.</text>
      <text x="72" y="356" fill="#8E9189" font-size="12" font-weight="700" letter-spacing="2.5">CUSTOMIZABLE  /  NATIVE  /  EXTENSIBLE</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="807" y="51" width="316" height="292" rx="18" fill="#282924" stroke="#60615A" stroke-opacity=".65"/>
      <rect x="825" y="70" width="280" height="42" rx="9" fill="#1A1B18"/>
      <circle cx="847" cy="91" r="5" fill="#E56122"/>
      <circle cx="864" cy="91" r="5" fill="#716F65"/>
      <circle cx="881" cy="91" r="5" fill="#716F65"/>
      <text x="982" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2.1" text-anchor="middle" fill="#ADADA5">SCREEN / APP</text>
      <rect x="825" y="126" width="139" height="146" rx="12" fill="url(#accent)"/>
      <path d="M851 153H924V171H871V185H942V239H851V222H922V202H851Z" fill="#F4F1EA"/>
      <rect x="924" y="153" width="18" height="18" fill="#252524"/>
      <rect x="980" y="127" width="125" height="67" rx="10" fill="#363730"/>
      <text x="994" y="151" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#D9A57F" letter-spacing="2">01 / BUILDS</text>
      <rect x="994" y="164" width="91" height="8" rx="4" fill="#6D6C61"/>
      <rect x="994" y="179" width="65" height="5" rx="2.5" fill="#54554D"/>
      <rect x="980" y="205" width="125" height="67" rx="10" fill="#363730"/>
      <text x="994" y="229" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#D9A57F" letter-spacing="1.5">02 / MODRINTH</text>
      <rect x="994" y="242" width="79" height="8" rx="4" fill="#6D6C61"/>
      <rect x="994" y="257" width="99" height="5" rx="2.5" fill="#54554D"/>
      <rect x="825" y="286" width="280" height="40" rx="9" fill="#181917"/>
      <rect x="839" y="299" width="10" height="10" rx="2" fill="#E56122"/>
      <text x="860" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#E4E1D7" font-weight="700" letter-spacing="1.2">READY TO LAUNCH</text>
      <path d="M1076 298L1087 306L1076 314Z" fill="#E56122"/>
    </g>
    <rect x="773" y="87" width="7" height="7" fill="#F4F1EA" opacity=".38"/>
    <rect x="1150" y="226" width="11" height="11" fill="#E56122"/>
    <rect x="1136" y="240" width="7" height="7" fill="#F4F1EA" opacity=".55"/>
    <path d="M1110 357H1170" stroke="#B85220" stroke-width="2" stroke-dasharray="4 6" opacity=".75"/>
  </g>
</svg>